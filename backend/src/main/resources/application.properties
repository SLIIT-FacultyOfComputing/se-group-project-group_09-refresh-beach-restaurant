spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/refresh_beach
spring.datasource.username=root
spring.datasource.password=group09@sliit
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8085

# Logging
logging.level.org.springframework=INFO
logging.level.com.refreshbeach=DEBUG
logging.level.com.refreshbeach.backend.model.Location=DEBUG
logging.level.com.refreshbeach.backend.model.LocationConverter=DEBUG