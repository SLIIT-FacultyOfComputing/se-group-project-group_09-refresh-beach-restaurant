spring.datasource.url=jdbc:mysql://localhost:3306/refresh_beach?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=group09@sliit
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.refreshbeach=DEBUG
logging.level.grp_9.restaurant2=DEBUG
logging.level.root=INFO

# Enable debug mode
debug=false

# Open-in-view setting (disable to remove warning)
spring.jpa.open-in-view=false

# Server port configuration
server.port=8085

