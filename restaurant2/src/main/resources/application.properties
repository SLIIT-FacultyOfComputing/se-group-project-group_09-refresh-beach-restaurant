spring.datasource.url=jdbc:mysql://localhost:3306/refresh_beach?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=group09@sliit
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Transaction isolation level configuration for better concurrency handling
spring.jpa.properties.hibernate.connection.isolation=8
# Server port configuration
server.port=8085

# Debug logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.refreshbeach=DEBUG
logging.level.grp_9.restaurant2=DEBUG
logging.level.root=INFO
# Enable debug mode
debug=false
# Open-in-view setting (disable to remove warning)
spring.jpa.open-in-view=false
# CORS configuration - added to match frontend
#spring.web.cors.allowed-origins=http://localhost:3000
#spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#spring.web.cors.allowed-headers=*

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# For testing purposes - set to false to actually send emails
spring.mail.test-connection=false
mail.testing.enabled=true








